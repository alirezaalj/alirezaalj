name: Generate Profile Metrics

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: ["main", "master"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate Detailed Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: alirezaalj
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Tehran
          
          # محاسبه دقیق داده‌های مخازن پرایوت
          plugin_lines: yes
          plugin_traffic: yes
          
          # زبان‌های برنامه‌نویسی با جزییات و درصد
          plugin_languages: yes
          plugin_languages_ignored: html, css
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          
          # تقویم فعالیت و کامیت‌ها
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          
          # نمودار ساعات پرکار (ساعت چندها بیشتر کامیت زدید)
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
